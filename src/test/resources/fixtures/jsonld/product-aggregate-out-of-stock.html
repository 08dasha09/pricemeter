<!DOCTYPE html>
<!-- Синтетична фікстура: AggregateOffer (маркетплейс), товару немає в наявності -->
<html lang="uk">
<head>
    <meta charset="utf-8">
    <script type="application/ld+json">
    {
      "@context": "http://schema.org/",
      "@type": "Product",
      "name": "Посудомийна машина Bosch SMS4HVI33E",
      "manufacturer": { "@type": "Organization", "name": "Bosch" },
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": 18750.5,
        "highPrice": 20999,
        "offerCount": 3,
        "priceCurrency": "UAH",
        "availability": "http://schema.org/OutOfStock"
      }
    }
    </script>
</head>
<body></body>
</html>
