spring.application.name=pricemeter

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pricemeter}
spring.datasource.username=${DB_USER:pricemeter}
spring.datasource.password=${DB_PASSWORD:pricemeter}

# JPA: schema is managed by Flyway only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.locations=classpath:db/migration

# Crawler HTTP client
crawler.http.user-agent=PricemeterBot/0.1 (educational price research)
crawler.http.max-attempts=3
crawler.http.initial-backoff=2s
crawler.http.default-min-interval=2s
crawler.http.respect-robots-txt=true

# Shops: category code -> category path on the shop site
crawler.shops.moyo.max-pages=30
crawler.shops.moyo.categories[WASHING_MACHINES]=/ua/bt/kbt/stiralnie-mashiny/
crawler.shops.moyo.categories[REFRIGERATORS]=/ua/bt/kbt/holodilniky/
crawler.shops.moyo.categories[DISHWASHERS]=/ua/bt/kbt/posudomoechnie-mashi/
crawler.shops.moyo.categories[VACUUM_CLEANERS]=/ua/bt/mbt/pylesosy/
crawler.shops.moyo.categories[MICROWAVES]=/ua/bt/tekhnika-dlya-kuhni/microvolnovie-pechi/
crawler.shops.citrus.max-pages=30
crawler.shops.citrus.categories[WASHING_MACHINES]=/stiralnye-mashiny/
crawler.shops.citrus.categories[REFRIGERATORS]=/holodilniki/
crawler.shops.citrus.categories[DISHWASHERS]=/posudomoechnye-mashiny/
crawler.shops.citrus.categories[VACUUM_CLEANERS]=/pylesosy/
crawler.shops.citrus.categories[MICROWAVES]=/mikrovolnovki/
# Epicentr: robots.txt forbids query strings, so max-pages = 1 category page + brand filter pages
crawler.shops.epicentr.max-pages=40
crawler.shops.epicentr.categories[WASHING_MACHINES]=/ua/shop/stiralnye-mashiny/
crawler.shops.epicentr.categories[REFRIGERATORS]=/ua/shop/kholodilniki/
crawler.shops.epicentr.categories[DISHWASHERS]=/ua/shop/posudomoechnye-mashiny/
crawler.shops.epicentr.categories[VACUUM_CLEANERS]=/ua/shop/pylesosy/
crawler.shops.epicentr.categories[MICROWAVES]=/ua/shop/mikrovolnovye-pechi/
# Eldorado: categories render client-side, products come from sitemaps filtered by slug prefix;
# category value must end with /c<id>/ - product mpath is checked against that id
crawler.shops.eldorado.product-sitemaps=https://eldorado.ua/sitemap/sitemap-main-home-uk.xml,https://eldorado.ua/sitemap/sitemap-main-kitchen-uk.xml
crawler.shops.eldorado.categories[WASHING_MACHINES]=/uk/washing_machines/c1039034/
crawler.shops.eldorado.categories[REFRIGERATORS]=/uk/holodilniki/c1061560/
crawler.shops.eldorado.categories[DISHWASHERS]=/uk/dishwashers/c1039049/
crawler.shops.eldorado.categories[VACUUM_CLEANERS]=/uk/node/c1039037/
crawler.shops.eldorado.categories[MICROWAVES]=/uk/microwaves/c1039050/
crawler.shops.eldorado.product-slug-prefixes[WASHING_MACHINES]=stiralnaya-mashina,pralina-mashina,pralna-mashina
crawler.shops.eldorado.product-slug-prefixes[REFRIGERATORS]=holodilnik,kholodilnik,holodylnyk,kholodylnyk
crawler.shops.eldorado.product-slug-prefixes[DISHWASHERS]=posudomoechnaya-mashina,posudomijna-mashina
crawler.shops.eldorado.product-slug-prefixes[VACUUM_CLEANERS]=pylesos,pilosos,pylosos
crawler.shops.eldorado.product-slug-prefixes[MICROWAVES]=mikrovolnovaya-pech,mikrohviliova-pich,mikrohvylova-pich

# Session id only in cookies (no ;jsessionid in redirect URLs)
server.servlet.session.tracking-modes=cookie

# Daily crawl of all enabled shops and categories (Kyiv time); shops run in parallel
crawler.schedule.enabled=true
crawler.schedule.cron=0 0 4 * * *
crawler.schedule.limit-per-category=200
crawler.schedule.lock-at-most-for=PT20H
# after startup: if the last successful crawl is older than catch-up-after, crawl all shops after catch-up-delay
crawler.schedule.catch-up=true
crawler.schedule.catch-up-after=PT20H
crawler.schedule.catch-up-delay=PT2M

# Offers not seen by the daily crawl for this many days are marked inactive
crawler.deactivate-after-days=7

# Matching: score >= auto-threshold -> merged automatically; review-threshold..auto -> manual review
matching.auto-threshold=0.9
matching.review-threshold=0.65

# Security: admin account is created on startup (password: ADMIN_PASSWORD env var, otherwise generated and logged once)
app.security.admin-email=${ADMIN_EMAIL:admin@pricemeter.local}
app.security.admin-password=${ADMIN_PASSWORD:}

# Notifications: e-mail is sent only when SPRING_MAIL_HOST (and SPRING_MAIL_USERNAME / _PASSWORD / _PORT) are set,
# otherwise notifications are written to the application log
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.notifications.from=${MAIL_FROM:Pricemeter <pricemeter@localhost>}

# Actuator: only /actuator/health (status for everyone, details incl. crawler state for admins)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
