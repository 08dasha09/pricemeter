<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пропозиції')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('offers')}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Пропозиції магазинів</h1>
            <p th:text="|Знайдено: ${offers.totalElements}|">Знайдено: 0</p>
        </div>
    </div>

    <form method="get" th:action="@{/offers}" class="card">
        <div class="toolbar">
            <label class="field field-search">Пошук
                <span class="search-input">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="search" name="q" th:value="${q}" placeholder="Назва або код моделі, напр. WW80T4040">
                </span>
            </label>
            <label class="field">Магазин
                <select name="shop">
                    <option value="">Усі магазини</option>
                    <option th:each="s : ${shops}" th:value="${s.code}" th:text="${s.name}"
                            th:selected="${s.code == shop}"></option>
                </select>
            </label>
            <label class="field">Категорія
                <select name="category">
                    <option value="">Усі категорії</option>
                    <option th:each="c : ${categories}" th:value="${c.code}" th:text="${c.name}"
                            th:selected="${c.code == category}"></option>
                </select>
            </label>
            <button type="submit" class="btn">Знайти</button>
        </div>
        <div class="toolbar-extra">
            <label class="check">
                <input type="checkbox" name="inactive" value="true" th:checked="${inactive}"
                       onchange="this.form.submit()">
                Показувати неактивні пропозиції
            </label>
        </div>
    </form>

    <div class="card section">
        <div th:if="${offers.empty}" class="empty">
            <strong>Нічого не знайдено</strong>
            Спробуйте змінити фільтри або запустіть <a th:href="@{/admin/crawl}">обхід магазину</a>.
        </div>

        <div class="table-wrap" th:unless="${offers.empty}">
            <table>
                <thead>
                <tr>
                    <th>Товар</th>
                    <th class="hide-sm">Магазин</th>
                    <th class="num">Ціна</th>
                    <th class="hide-sm">Наявність</th>
                    <th class="hide-sm">Оновлено</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${offers}">
                    <td>
                        <a class="offer-title" th:href="@{/offers/{id}(id=${o.id})}" th:text="${o.title}">
                            Samsung WW80T4040CE1UA</a>
                        <span class="sub">
                            <span th:text="${o.categoryName} ?: 'Без категорії'">Пральні машини</span>
                            <span class="show-sm" th:text="|· ${o.shopName}|">· Moyo</span>
                            <span th:unless="${o.active}" class="pill pill-neutral">неактивна</span>
                        </span>
                    </td>
                    <td class="hide-sm" th:insert="~{fragments/layout :: shop(${o.shopCode}, ${o.shopName})}"></td>
                    <td class="num">
                        <div class="price-stack" th:if="${o.price != null}">
                            <span class="price">
                                <th:block th:text="${#numbers.formatDecimal(o.price, 1, 'WHITESPACE', 0, 'POINT')}">15 999</th:block><small>₴</small>
                            </span>
                            <span class="meta" th:if="${o.oldPrice != null}">
                                <span class="old-price"
                                      th:text="${#numbers.formatDecimal(o.oldPrice, 1, 'WHITESPACE', 0, 'POINT')}">18 999</span>
                                <span class="pill pill-discount" th:text="|−${o.discountPercent()}%|">−16%</span>
                            </span>
                        </div>
                        <span th:if="${o.price == null}" class="muted">—</span>
                    </td>
                    <td class="hide-sm">
                        <span th:if="${o.available}" class="stock in"><span class="dot"></span>є</span>
                        <span th:unless="${o.available}" class="stock out"><span class="dot"></span>немає</span>
                    </td>
                    <td class="hide-sm muted nowrap"
                        th:text="${#temporals.format(o.lastSeenAt, 'dd.MM.yyyy HH:mm')}">04.10.2026 12:00</td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="pagination" th:if="${offers.totalPages > 1}">
            <a class="btn btn-ghost" th:classappend="${offers.hasPrevious()} ? '' : 'disabled'"
               th:href="@{${pageUrlPrefix + (offers.number - 1)}}">← Попередня</a>
            <span th:text="|Сторінка ${offers.number + 1} з ${offers.totalPages}|">Сторінка 1 з 2</span>
            <a class="btn btn-ghost" th:classappend="${offers.hasNext()} ? '' : 'disabled'"
               th:href="@{${pageUrlPrefix + (offers.number + 1)}}">Наступна →</a>
        </nav>
    </div>
</main>
</body>
</html>
